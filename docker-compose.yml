# Стенд проекта DIPLOMA — newresearch branch
# Сервисы: db, energy, water, transport, risk_engine, scenario_simulator, optimizer (TODO)

services:
  # ==========================
  # POSTGRES
  # ==========================
  db:
    image: postgres:16
    container_name: diploma-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-diploma}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ==========================
  # ENERGY SERVICE  (:8001)
  # ==========================
  energy_service:
    build: ./services/energy_service
    container_name: energy_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/diploma
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENV: ${ENV:-dev}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    restart: unless-stopped

  # ==========================
  # WATER SERVICE  (:8002)
  # ==========================
  water_service:
    build: ./services/water_service
    container_name: water_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/diploma
      ENERGY_SERVICE_URL: http://energy_service:8000/api/v1/energy
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENV: ${ENV:-dev}
    depends_on:
      db:
        condition: service_healthy
      energy_service:
        condition: service_started
    ports:
      - "8002:8000"
    restart: unless-stopped

  # ==========================
  # TRANSPORT SERVICE  (:8003)
  # ==========================
  transport_service:
    build: ./services/transport_service
    container_name: transport_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/diploma
      ENERGY_SERVICE_URL: http://energy_service:8000/api/v1/energy
      WATER_SERVICE_URL: http://water_service:8000/api/v1/water
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENV: ${ENV:-dev}
    depends_on:
      db:
        condition: service_healthy
      energy_service:
        condition: service_started
      water_service:
        condition: service_started
    ports:
      - "8003:8000"
    restart: unless-stopped

  # ==========================
  # RISK ENGINE  (:8004)
  # СДУ-интегратор, матрица A, cascade detection, baselines
  # ==========================
  risk_engine:
    build: ./services/risk_engine
    container_name: risk_engine
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/diploma
      ENERGY_SERVICE_URL: http://energy_service:8000/api/v1/energy/status
      WATER_SERVICE_URL: http://water_service:8000/api/v1/water/status
      TRANSPORT_SERVICE_URL: http://transport_service:8000/api/v1/transport/status
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENV: ${ENV:-dev}
    depends_on:
      db:
        condition: service_healthy
      energy_service:
        condition: service_started
      water_service:
        condition: service_started
      transport_service:
        condition: service_started
    ports:
      - "8004:8000"
    restart: unless-stopped

  # ==========================
  # SCENARIO SIMULATOR  (:8005)
  # MC-оркестрация, СДУ-сценарии
  # ==========================
  scenario_simulator:
    build: ./services/scenario_simulator
    container_name: scenario_simulator
    environment:
      RISK_ENGINE_URL: http://risk_engine:8000
      ENERGY_SERVICE_URL: http://energy_service:8000
      WATER_SERVICE_URL: http://water_service:8000
      TRANSPORT_SERVICE_URL: http://transport_service:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENV: ${ENV:-dev}
    volumes:
      - ./matrix_doc:/app/matrix_doc:ro
      - ./data/calibration:/app/data/calibration:ro
    depends_on:
      risk_engine:
        condition: service_started
    ports:
      - "8005:8000"
    restart: unless-stopped

  # ==========================
  # OPTIMIZER  (:8006)  — TODO
  # Стохастическая оптимизация min_{ΔA} E[Σ w_j(1−S_j)]
